type Task {
  id: ID!
  title: String!
  description: String
  status: Int!
}

input CreateTaskInput {
  title: String!
  description: String
  projectId: Int!
  assigneeId: Int
}

input UpdateTaskInput {
  id: ID!
  title: String
  description: String
}

type Mutation {
  createTask(input: CreateTaskInput!): Task! @auth
  updateTask(input: UpdateTaskInput!): Task! @auth
  deleteTask(id: ID!): Task! @auth

}
