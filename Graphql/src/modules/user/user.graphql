type User {
  id: ID!
  name: String!
  email: String!
  role: UserRole! 
  ownedProjects: [Project!]!
}
enum UserRole {
  ADMIN
  USER
}

type AuthPayload {
  token: String!
  user: User!
}

input CreateUserInput {
  name: String!
  email: String!
  password: String!
}

input LoginInput {
  email: String!
  password: String!
}

type Query {
  users: [User!]!
}

type Mutation {
  createUser(input: CreateUserInput!): User!
  login(input: LoginInput!): AuthPayload!
}
